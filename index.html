<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Card Fruit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E9ECF1;font-family:'Noto Sans TC',system-ui,sans-serif;color:#111418;-webkit-text-size-adjust:100%}
#app{max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(17,20,24,.12)}
a{color:#4453B0}
h1,h2,p{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hd{display:flex;align-items:center;gap:4px;padding:8px 10px;flex-shrink:0}
.hd h1{font-size:20px;font-weight:700}
.hd.line{border-bottom:1px solid #E4E7EC}
.ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#111418;border:0;background:transparent;flex-shrink:0}
.top{padding:16px 20px 12px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.top h1{font-size:22px;font-weight:700}
.scroll{flex:1;overflow-y:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:20px}
.scroll>*{flex-shrink:0}
.foot{padding:12px 20px 20px;border-top:1px solid #E4E7EC;display:flex;gap:12px;flex-shrink:0}
.muted{color:#5B6470}
.s12{font-size:12px}.s13{font-size:13px;line-height:1.6}.s14{font-size:14px;line-height:1.6}
.b{font-weight:700}
.h2{font-size:16px;font-weight:700}
.btn{height:52px;padding:0 22px;border-radius:26px;border:0;background:#4453B0;color:#fff;font-size:16px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;flex:1}
.btn.o{background:#fff;color:#111418;border:1px solid #111418}
.btn.dark{background:#111418}
.btn.sm{height:44px;font-size:13px;padding:0 18px;border-radius:22px;flex:none}
.btn.white{background:#fff;color:#111418;flex:none;align-self:flex-start;height:46px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex-shrink:0;height:44px;padding:0 16px;border-radius:22px;border:1px solid #C9CFD8;background:#fff;color:#111418;font-size:13px;font-weight:500;text-decoration:none;display:flex;align-items:center}
.chip.soft{border-color:#F3F5F8;background:#F3F5F8;font-size:14px}
.chip.on{background:#111418;border-color:#111418;color:#fff}
.seg{display:flex;background:#F3F5F8;border-radius:24px;padding:4px}
.seg>*{flex:1;height:42px;border:0;border-radius:20px;background:transparent;color:#5B6470;font-size:14px;font-weight:500;text-decoration:none;display:flex;align-items:center;justify-content:center}
.seg>.on{background:#fff;color:#111418;font-weight:700;box-shadow:0 1px 3px rgba(17,20,24,.12)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#111418}
.sw{background:#F3F5F8;border-radius:12px;padding:16px 28px}
.slab{aspect-ratio:3/5;background:#DDE2EA;border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:5px}
.slab .lab{background:#fff;border-radius:3px;font-size:10px;font-weight:700;padding:3px 5px;display:flex;justify-content:space-between;min-height:8px}
.slab .art{flex:1;background:#2A3140;border-radius:3px;color:#B9C2CF;font-size:11px;display:flex;align-items:center;justify-content:center}
.thumb{flex-shrink:0;width:76px;background:#F3F5F8;border-radius:10px;padding:8px 14px;align-self:flex-start;display:block}
.thumb .slab{padding:3px;gap:3px;border-radius:4px}
.thumb .lab{padding:0;height:7px}
.card .nm{font-size:13px;line-height:1.4;height:36px;overflow:hidden}
.card .pr{font-size:16px;font-weight:700}
.rowi{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #E4E7EC}
.rowi .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.box{border:1px solid #E4E7EC;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #E4E7EC;font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:#5B6470;flex-shrink:0}
.kv>span:last-child{font-weight:500;text-align:right}
.pill{align-self:flex-start;flex-shrink:0;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:#E4E7EC;color:#111418}
.pill.lead{background:#4453B0;color:#fff}
.pill.warn{background:#FFE8D9;color:#9A3412}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{height:48px;padding:0 14px;border:1px solid #C9CFD8;border-radius:10px;font-size:15px;background:#fff;color:#111418;width:100%}
.field textarea{height:auto;padding:12px 14px;line-height:1.6;resize:vertical}
.two{display:flex;gap:12px}.two>*{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.check input{width:20px;height:20px;accent-color:#4453B0;margin:0;flex-shrink:0}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:1px solid #C9CFD8;border-radius:12px}
.opt input{width:20px;height:20px;accent-color:#4453B0;margin:0;flex-shrink:0}
.soft{background:#F3F5F8;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dark{background:#111418;color:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tick{width:72px;height:72px;border-radius:36px;background:#4453B0;display:flex;align-items:center;justify-content:center}
.nav{height:64px;flex-shrink:0;display:flex;border-top:1px solid #E4E7EC;background:#fff}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#5B6470;text-decoration:none}
.nav a.on{color:#4453B0;font-weight:700}
.searchbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:#F3F5F8;border-radius:24px;text-decoration:none;color:#5B6470;font-size:14px;flex:1;min-width:0}
.searchbar input{flex:1;border:0;background:transparent;font-size:14px;color:#111418;min-width:0;height:44px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid #E4E7EC;border-radius:14px;text-decoration:none;color:#111418}
.link{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;border-bottom:1px solid #E4E7EC;text-decoration:none;color:#111418;font-size:15px}
.sw-btn{flex-shrink:0;width:52px;height:44px;border:0;background:transparent;padding:7px 0}
.sw-btn span{display:flex;width:52px;height:30px;border-radius:15px;background:#8792A2;padding:3px}
.sw-btn i{width:24px;height:24px;border-radius:12px;background:#fff;display:block}
.sw-btn.on span{background:#4453B0;justify-content:flex-end}
.step{display:flex;gap:14px;padding:10px 0}
.step b{flex-shrink:0;width:32px;height:32px;border-radius:16px;background:#E4E7EC;font-size:14px;display:flex;align-items:center;justify-content:center}
.step.on b{background:#4453B0;color:#fff}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #E4E7EC;border-radius:12px}
.stat.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat>div{padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat>div+div{border-left:1px solid #E4E7EC}
.stat b{font-size:18px}
details{border-bottom:1px solid #E4E7EC}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:15px}
summary::-webkit-details-marker{display:none}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid #4453B0;outline-offset:2px}
</style>
</head>

+'<section>'+links.map(function(x){return '<a class="link" href="#'+x[0]+'"'+(x[3]?' data-act="'+x[3]+'"':'')+' style="min-height:64px"><span style="display:flex;flex-direction:column;gap:2px"><span>'+x[1]+'</span><span class="s12 muted">'+x[2]+'</span></span>'+I.next+'</a>'}).join('')+'</section></div>'+nav('activity')};

+'<div class="field"><label for="pfn">顯示名稱</label><input id="pfn" type="text" placeholder="[會員名稱]"></div><div class="field"><label for="pfe">電郵</label><input id="pfe" type="email" placeholder="name@example.com"></div><div class="field"><label for="pfp">電話</label><input id="pfp" type="tel" placeholder="[電話號碼]"></div>'
+'<section><h2 class="h2">收貨地址</h2><div class="kv"><span>預設地址</span><span>[收貨地址]</span></div></section><a class="btn" style="flex:none" href="#account">儲存</a></div>'};
var NOTI=[['新活動','你關注嘅遊戲有新比賽或活動'],['活動提醒','報名咗嘅活動開始前提醒'],['送評進度','PSA 送評去到下一步']];
V.notify=function(){return head('通知設定','account')+'<div class="scroll" style="padding-top:4px;gap:0">'+NOTI.map(function(n,i){var on=!S.noti[i];
return '<div class="rowi" style="align-items:center;justify-content:space-between"><div><div class="s14" style="font-weight:500">'+n[0]+'</div><div class="s12 muted">'+n[1]+'</div></div><button type="button" role="switch" aria-checked="'+on+'" aria-label="'+n[0]+'" class="sw-btn'+(on?' on':'')+'" data-act="notiToggle" data-arg="'+i+'"><span><i></i></span></button></div>'}).join('')+'</div>'};
V.help=function(){var g=[['PSA 鑑定',[['點樣申請送評？','喺「鑑定」頁揀「申請送評」，填卡片數量同服務級別，然後將卡交到門市。'],['送評要幾耐？','[各服務級別嘅處理時間]']]],['遊戲報名',[['點樣報名比賽？','喺「遊戲」揀活動，登入之後填參賽名稱就完成報名。'],['可唔可以取消報名？','[取消及退款安排]']]],['取卡同運送',[['評好嘅卡點樣攞返？','卡片寄返香港之後，可以去門市自取或者揀送貨。'],['有咩運送方式？','[運送方式、收費及所需時間]']]]];
return head('說明中心','account')+'<div class="scroll" style="padding-top:4px"><p class="s13 muted">常見問題。答案內容待確認，以下係示範文字。</p>'+g.map(function(x){return '<section><h2 class="h2">'+x[0]+'</h2>'+x[1].map(function(f){return '<details><summary><span>'+f[0]+'</span><span class="muted">'+I.down+'</span></summary><p class="s14 muted" style="padding-bottom:16px">'+f[1]+'</p></details>'}).join('')+'</section>'}).join('')+'<a class="btn o" style="flex:none;height:50px;font-size:15px" href="#contact">搵唔到答案？聯絡我們</a></div>'};

V.services=function(){var s=[['events','遊戲報名','卡牌比賽同交流活動，網上報名。'],['psa','PSA 鑑定','查證書、追送評進度，亦可以代你送評。'],['login','會員優惠','會員專享特低佣金同市場焦點。']];
return head('我們的服務','account')+'<div class="scroll" style="padding-top:4px;gap:12px"><p class="s13 muted">鑑定同比賽，一個 app 搞掂。</p>'+s.map(function(x){return '<a class="tile" style="flex-direction:row;align-items:center;justify-content:space-between;gap:14px" href="#'+x[0]+'"><div><div class="h2">'+x[1]+'</div><div class="s13 muted">'+x[2]+'</div></div>'+I.next+'</a>'}).join('')+'</div>'};

V.contact=function(){return head('聯絡我們','account')+'<div class="scroll" style="padding-top:4px;gap:24px"><section class="box" style="gap:0;padding:4px 16px"><div class="kv"><span>電郵</span><span>[客戶服務電郵]</span></div><div class="kv"><span>電話／WhatsApp</span><span>[電話號碼]</span></div><div class="kv"><span>地址</span><span>[門市或辦公室地址]</span></div><div class="kv"><span>營業時間</span><span>[營業時間]</span></div></section>'
+(S.sent?'<div class="soft done" role="status" style="padding:28px 16px"><div class="tick" style="width:56px;height:56px">'+I.tick+'</div><div class="b" style="font-size:20px">示範：訊息未有真正送出</div><p class="s14 muted">正式版本會喺 [回覆時間] 內以電郵回覆。</p><button type="button" class="btn o sm" data-act="unsend">再寫一則</button></div>'
:'<section style="display:flex;flex-direction:column;gap:16px"><h2 class="h2">留言俾我哋</h2><div class="field"><label for="ctopic">查詢類別</label><select id="ctopic"><option>PSA 鑑定</option><option>遊戲報名</option><option>取卡同運送</option><option>帳戶</option><option>其他</option></select></div><div class="field"><label for="cmsg">訊息</label><textarea id="cmsg" rows="5" placeholder="請描述你嘅問題，如有訂單編號請一併提供"></textarea></div><button type="button" class="btn" style="flex:none" data-act="send">送出訊息</button></section>')+'</div>'};

var A={
game:function(a){S.game=a},certGo:function(){S.psa.tab='cert';S.psa.certAsked=true;if(API_BASE)liveCert()},
toLogin:function(){S.join=false},toJoin:function(){S.join=true},
signin:function(){S.user=true;var to=S.after||'main';S.after=null;location.hash='#'+to},signout:function(){S.user=false},
psaTab:function(a){S.psa.tab=a},psaTrack:function(){S.psa.tab='track'},subGo:function(){S.psa.subAsked=true;if(API_BASE)liveTrack()},psaApply:function(){S.psa.applied=true},
reg:function(){S.regCount=(S.regCount||0)+1;S.regs[S.evId]='EV-00'+S.regCount;ev(S.evId).taken++},unreg:function(){delete S.regs[S.evId];ev(S.evId).taken--},
notiToggle:function(a){S.noti[a]=!S.noti[a]},send:function(){S.sent=true},unsend:function(){S.sent=false}
};

var app=document.getElementById('app'),cur=null;
function route(){var r=location.hash.replace('#','');return V[r]?r:'main'}
function render(top){var r=route(),sc=app.querySelector('.scroll'),y=sc?sc.scrollTop:0;
app.innerHTML=V[r]();var n=app.querySelector('.scroll');
if(n)n.scrollTop=(r===cur&&!top)?y:0;cur=r}
function setPath(path,val){var p=path.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
app.addEventListener('click',function(e){var el=e.target.closest('[data-ev],[data-game],[data-after],[data-act]');if(!el)return;
var d=el.dataset;
if(d.game)S.game=d.game;
if(d.ev)S.evId=d.ev;
if(d.after)S.after=d.after;
if(d.act&&A[d.act])A[d.act](d.arg);
var href=el.tagName==='A'?el.getAttribute('href'):null;
if(!href)render();else if(href===location.hash)render(true)});
function onInput(e){var b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
var v=e.target.type==='checkbox'?e.target.checked:e.target.value;setPath(b,v);
if(b==='q'){var r=document.getElementById('results');if(r)r.innerHTML=searchResults()}
else if(e.target.dataset.rerender&&e.type==='change')render()}
app.addEventListener('input',onInput);app.addEventListener('change',onInput);
window.addEventListener('hashchange',function(){render(true)});
render(true);
</script>
